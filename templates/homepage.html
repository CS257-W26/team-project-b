<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{ title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        {% extends 'base.html' %}

        {% block title %}Home{% endblock %}

        {% block content %}
        
            <h1>Emission Tracker</h1>
        
            <div class = home-instruct>
                <h3>Select a field</h3>
                <p>Choose a topic to analyze climate change</p>
            </div>
            
            <div class = "search-container">

                <form action = "/stats">
                    <label for = "country_stats">Country:</label>
                    <input type = "text" id = "country_stats" name = "country_stats" placeholder = "Country">
                    <input type = "submit" name = "stats_input" value = "Submit">
                </form>
                <form action = "/year_co2">
                    <label for = "year_co2">Yearly Co2:</label>
                    <br>
                    <input type = "text" id = "year_co2" name = "year_co2" placeholder = "Year">
                    <input type = "submit" name = "year_co2_input" value = "Submit">
                </form>
                <form action = "/year_energy">
                    <label for = "year_energy">Yearly Energy:</label>
                    <br>
                    <input type = "text" id = "year_energy" name = "year_energy" placeholder = "Year">
                    <input type = "submit" name = "year_energy_input" value = "Submit">
                </form>

            </div>
        {% endblock %}
    </body>
</html>
