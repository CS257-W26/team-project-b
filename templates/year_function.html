<html>

    <head>
        <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    </head>

    <body>
        {% extends 'base.html' %}
        
        {% block title %}Filter by Year{% endblock %}

        {% block content %}

        <div class = "year_heading">
            <h1 id="year_title">{{title}}</h1>
            <h2 id = "year_given">Global CO₂ Emissions from {{year_html}}</h2>
        </div>
        
        <div class = "year-co2-search">
            <form action = "/year_co2" method = "get">
                <label id = "year_co2">Enter a year:</label>
                <input type = "text" id = "year_co2" name = "year_co2" placeholder = "Year" value = "{{ year_html }}" required>
                <input type="submit" value="Submit">
            </form>
        </div>
        
        <div class = "table-data">
            <table class="year-table">
                <thead>
                    <tr>
                        <th>Country</th>
                        <th>CO₂ Emissions</th>
                        <th>CO₂ per Capita</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in output %}
                    <tr>
                        <td>{{ row[0] }}</td>
                        <td>{{ row[2] }}</td>
                        <td>{{ row[3] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        {% endblock%}
    </body>
</html>
